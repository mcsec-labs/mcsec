[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mcsec-labs/mcsec"

[workspace.dependencies]
mcsec-core = { path = "crates/mcsec-core" }

# Jar reading. The zip container is parsed in mcsec-core to match the JVM's
# rules, and only entry decompression is delegated. The miniz_oxide backend
# is pure Rust without unsafe code. Mods only use stored and deflate entries.
flate2 = { version = "1.1", default-features = false, features = [
    "rust_backend",
] }
crc32fast = "1.5"

# Writes the zip fixtures built in tests.
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

# File hashes. SHA-1 and SHA-512 match what Modrinth publishes per file.
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"

# Report output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Rule definition files. Only the parser, since rules are read, never written.
toml = { version = "1.1", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }

# Errors
thiserror = "2.0"

# CLI
clap = { version = "4.6", features = ["derive"] }
